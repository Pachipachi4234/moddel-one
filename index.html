<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moddel-one | プロ配信用 ボイスチェンジャー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 20px;
            width: 20px;
            border-radius: 50%;
            background: #10b981;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #334155;
            border-radius: 2px;
        }
        input[type=range]:focus { outline: none; }
        
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        #visualizer {
            width: 100%;
            height: 200px;
            border-radius: 0.5rem;
            background: #000;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col p-4 md:p-8">

    <!-- Header -->
    <header class="mb-8">
        <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-green-400 mb-2">
            Moddel-one ボイスチェンジャー
        </h1>
        <div class="glass-panel p-4 rounded-lg border-l-4 border-l-green-500 text-sm text-gray-300">
            <strong class="text-green-400">※解析機能修正済み：</strong> 音声ファイルをアップロードすると正常に周波数を読み取り、EQとピッチを自動調整します。
        </div>
    </header>

    <main class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Left Panel: Controls -->
        <div class="glass-panel rounded-xl p-6 lg:col-span-1 flex flex-col gap-6">
            
            <!-- Mic Control -->
            <div>
                <h2 class="text-xl font-semibold mb-4 text-blue-400 flex items-center gap-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                    入力ソース
                </h2>
                <button id="btn-toggle-mic" class="w-full py-3 rounded-lg bg-blue-600 hover:bg-blue-500 transition font-bold text-white shadow-[0_0_15px_rgba(37,99,235,0.5)]">
                    マイクをオンにする
                </button>
                <p id="mic-status" class="text-xs text-center mt-2 text-gray-400">マイクは未接続です。</p>
            </div>

            <hr class="border-slate-700">

            <!-- 🌸 声質プリセット -->
            <div>
                <h2 class="text-xl font-semibold mb-2 text-yellow-400">⚡ クイック声質プリセット</h2>
                <div class="grid grid-cols-2 gap-2 mt-3">
                    <button id="btn-preset-yukkuri" class="py-2 px-3 rounded bg-yellow-600 hover:bg-yellow-500 font-bold text-xs text-white shadow transition">
                        🌸 ゆっくりボイス風
                    </button>
                    <button id="btn-preset-reset" class="py-2 px-3 rounded bg-slate-700 hover:bg-slate-600 font-bold text-xs text-gray-200 transition">
                        🔄 リセット (地声)
                    </button>
                </div>
            </div>

            <hr class="border-slate-700">

            <!-- Target Audio Analysis -->
            <div>
                <h2 class="text-xl font-semibold mb-2 text-green-400">ターゲット音声解析</h2>
                <p class="text-xs text-gray-400 mb-3">サンプル(mp3/wav)をアップロードして、EQ/ピッチ設定を自動近似させます。</p>
                <label class="block w-full border-2 border-dashed border-slate-600 hover:border-green-400 transition rounded-lg p-4 text-center cursor-pointer">
                    <span id="file-label" class="text-sm font-medium">クリックして音声ファイルを選択</span>
                    <input type="file" id="target-audio-upload" accept="audio/*" class="hidden">
                </label>
                <button id="btn-play-sample" class="w-full mt-2 py-1.5 rounded bg-slate-800 hover:bg-slate-700 text-xs font-bold text-gray-300 hidden border border-slate-600">
                    ▶️ アップロード音声を再生・確認
                </button>
                <div id="analysis-status" class="text-xs text-green-300 mt-2 hidden">解析中...</div>
            </div>

            <hr class="border-slate-700">

            <!-- Voice Shaping Controls -->
            <div class="flex-1 flex flex-col gap-4">
                <h2 class="text-xl font-semibold text-blue-400">ボイスシェイピング＆音量</h2>
                
                <!-- 🔊 音量ブースト -->
                <div class="bg-blue-900/40 p-3 rounded border border-blue-500/50">
                    <div class="flex justify-between mb-1">
                        <label class="text-sm font-bold text-yellow-300">🔊 音量ブースト (増幅)</label>
                        <span id="val-volume" class="text-sm text-yellow-300 font-bold">3.0 倍</span>
                    </div>
                    <input type="range" id="slider-volume" min="1" max="10" step="0.5" value="3">
                </div>

                <!-- Pitch -->
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="text-sm font-medium">ピッチシフト (声の高さ)</label>
                        <span id="val-pitch" class="text-sm text-green-400">+8.5 st</span>
                    </div>
                    <input type="range" id="slider-pitch" min="-12" max="24" step="0.5" value="8.5">
                </div>

                <!-- Low EQ -->
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="text-sm font-medium">低音 EQ (150 Hz)</label>
                        <span id="val-low" class="text-sm text-blue-300">-6 dB</span>
                    </div>
                    <input type="range" id="slider-low" min="-24" max="24" step="0.5" value="-6">
                </div>

                <!-- Mid EQ -->
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="text-sm font-medium">中音 EQ (1000 Hz)</label>
                        <span id="val-mid" class="text-sm text-blue-300">+3 dB</span>
                    </div>
                    <input type="range" id="slider-mid" min="-24" max="24" step="0.5" value="3">
                </div>

                <!-- High EQ -->
                <div>
                    <div class="flex justify-between mb-1">
                        <label class="text-sm font-medium">高音 EQ (4000 Hz)</label>
                        <span id="val-high" class="text-sm text-blue-300">+8 dB</span>
                    </div>
                    <input type="range" id="slider-high" min="-24" max="24" step="0.5" value="8">
                </div>
            </div>
        </div>

        <!-- Right Panel: Visualizer & Output -->
        <div class="lg:col-span-2 flex flex-col gap-6">
            <div class="glass-panel rounded-xl p-6 flex-1 flex flex-col">
                <h2 class="text-2xl font-bold mb-4 text-white flex items-center gap-2">
                    <svg class="w-6 h-6 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                    出力モニター
                </h2>
                
                <div class="flex-1 w-full bg-black rounded-lg border border-slate-700 relative overflow-hidden flex items-center justify-center min-h-[300px]">
                    <canvas id="visualizer"></canvas>
                </div>
                
                <div class="mt-4 flex gap-4 items-center">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="check-monitor" class="w-5 h-5 accent-blue-500" checked>
                        <span class="text-sm font-medium text-gray-300">出力を自分のイヤホン/スピーカーで聞く (モニター)</span>
                    </label>
                </div>
            </div>
        </div>
    </main>

    <script>
        const pitchShifterWorkletCode = `
        class PitchShifterProcessor extends AudioWorkletProcessor {
            constructor() {
                super();
                this.bufferSize = 4096;
                this.delayBuffer = new Float32Array(this.bufferSize);
                this.writePointer = 0;
                this.pitchRatio = 1.0; 
                this.windowSize = 2048; 
                this.readPointer1 = 0;
                this.readPointer2 = this.windowSize / 2;
            }

            static get parameterDescriptors() {
                return [{ name: 'pitchRatio', defaultValue: 1.0, minValue: 0.25, maxValue: 4.0 }];
            }

            process(inputs, outputs, parameters) {
                const input = inputs[0];
                const output = outputs[0];
                if (!input || !input[0] || !output || !output[0]) return true;

                const inputChannel = input[0];
                const outputChannel = output[0];
                const pitchRatio = parameters.pitchRatio.length > 1 ? parameters.pitchRatio[0] : parameters.pitchRatio[0];

                for (let i = 0; i < inputChannel.length; i++) {
                    this.delayBuffer[this.writePointer] = inputChannel[i];
                    
                    let delay1 = this.writePointer - Math.floor(this.readPointer1);
                    if (delay1 < 0) delay1 += this.bufferSize;
                    let delay2 = this.writePointer - Math.floor(this.readPointer2);
                    if (delay2 < 0) delay2 += this.bufferSize;

                    const sample1 = this.delayBuffer[(Math.floor(this.readPointer1)) % this.bufferSize];
                    const sample2 = this.delayBuffer[(Math.floor(this.readPointer2)) % this.bufferSize];

                    let env1 = 1.0 - Math.abs(delay1 - this.windowSize / 2) / (this.windowSize / 2);
                    let env2 = 1.0 - Math.abs(delay2 - this.windowSize / 2) / (this.windowSize / 2);
                    env1 = Math.max(0, env1); env2 = Math.max(0, env2);
                    const envSum = env1 + env2 + 0.0001;
                    
                    outputChannel[i] = (sample1 * env1 + sample2 * env2) / envSum;

                    this.writePointer = (this.writePointer + 1) % this.bufferSize;
                    this.readPointer1 = (this.readPointer1 + pitchRatio) % this.bufferSize;
                    this.readPointer2 = (this.readPointer2 + pitchRatio) % this.bufferSize;
                }

                for (let channel = 1; channel < output.length; channel++) {
                    output[channel].set(outputChannel);
                }
                return true;
            }
        }
        registerProcessor('pitch-shifter', PitchShifterProcessor);
        `;

        let audioCtx, micStream, sourceNode, inputGainNode, pitchShifterNode, lowEq, midEq, highEq, analyserNode, outputGainNode;
        let sampleAudio = null;
        let isMicActive = false, animationId;

        const btnToggleMic = document.getElementById('btn-toggle-mic');
        const micStatus = document.getElementById('mic-status');
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');
        const checkMonitor = document.getElementById('check-monitor');
        const fileUpload = document.getElementById('target-audio-upload');
        const fileLabel = document.getElementById('file-label');
        const analysisStatus = document.getElementById('analysis-status');
        const btnPlaySample = document.getElementById('btn-play-sample');

        const sliderVolume = document.getElementById('slider-volume');
        const sliderPitch = document.getElementById('slider-pitch');
        const sliderLow = document.getElementById('slider-low');
        const sliderMid = document.getElementById('slider-mid');
        const sliderHigh = document.getElementById('slider-high');

        const valVolume = document.getElementById('val-volume');
        const valPitch = document.getElementById('val-pitch');
        const valLow = document.getElementById('val-low');
        const valMid = document.getElementById('val-mid');
        const valHigh = document.getElementById('val-high');

        async function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            const blob = new Blob([pitchShifterWorkletCode], { type: 'application/javascript' });
            const blobUrl = URL.createObjectURL(blob);
            await audioCtx.audioWorklet.addModule(blobUrl);

            inputGainNode = audioCtx.createGain();
            inputGainNode.gain.value = parseFloat(sliderVolume.value);

            pitchShifterNode = new AudioWorkletNode(audioCtx, 'pitch-shifter');
            
            lowEq = audioCtx.createBiquadFilter();
            lowEq.type = 'lowshelf'; lowEq.frequency.value = 150;

            midEq = audioCtx.createBiquadFilter();
            midEq.type = 'peaking'; midEq.frequency.value = 1000; midEq.Q.value = 1.0;

            highEq = audioCtx.createBiquadFilter();
            highEq.type = 'highshelf'; highEq.frequency.value = 4000;

            analyserNode = audioCtx.createAnalyser(); analyserNode.fftSize = 2048;
            outputGainNode = audioCtx.createGain();
            outputGainNode.gain.value = checkMonitor.checked ? parseFloat(sliderVolume.value) : 0.0;

            inputGainNode.connect(pitchShifterNode);
            pitchShifterNode.connect(lowEq);
            lowEq.connect(midEq);
            midEq.connect(highEq);
            highEq.connect(analyserNode);
            analyserNode.connect(outputGainNode);
            outputGainNode.connect(audioCtx.destination);
            
            updateCanvasSize();
            window.addEventListener('resize', updateCanvasSize);
        }

        btnToggleMic.addEventListener('click', async () => {
            if (!isMicActive) {
                try {
                    await initAudio();
                    if (audioCtx.state === 'suspended') await audioCtx.resume();

                    micStream = await navigator.mediaDevices.getUserMedia({ 
                        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } 
                    });
                    
                    sourceNode = audioCtx.createMediaStreamSource(micStream);
                    sourceNode.connect(inputGainNode);
                    
                    isMicActive = true;
                    btnToggleMic.textContent = 'マイクをオフにする';
                    btnToggleMic.className = 'w-full py-3 rounded-lg bg-red-600 hover:bg-red-500 transition font-bold text-white shadow-[0_0_15px_rgba(220,38,38,0.5)]';
                    micStatus.textContent = '🎙️ マイク接続・音声モニター中！';
                    micStatus.classList.replace('text-gray-400', 'text-green-400');
                    
                    updateSliders();
                    drawVisualizer();
                } catch (err) {
                    console.error('Mic error:', err);
                    alert('マイクにアクセスできませんでした。権限を確認してください。');
                }
            } else {
                if (micStream) micStream.getTracks().forEach(track => track.stop());
                if (sourceNode) sourceNode.disconnect();
                isMicActive = false;
                btnToggleMic.textContent = 'マイクをオンにする';
                btnToggleMic.className = 'w-full py-3 rounded-lg bg-blue-600 hover:bg-blue-500 transition font-bold text-white shadow-[0_0_15px_rgba(37,99,235,0.5)]';
                micStatus.textContent = 'マイクは未接続です。';
                micStatus.classList.replace('text-green-400', 'text-gray-400');
                cancelAnimationFrame(animationId);
                canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
            }
        });

        checkMonitor.addEventListener('change', (e) => {
            if (outputGainNode) outputGainNode.gain.value = e.target.checked ? parseFloat(sliderVolume.value) : 0.0;
        });

        function updateSliders() {
            if (!pitchShifterNode) return;

            const vol = parseFloat(sliderVolume.value);
            valVolume.textContent = `${vol.toFixed(1)} 倍`;
            if (inputGainNode) inputGainNode.gain.value = vol;
            if (outputGainNode && checkMonitor.checked) outputGainNode.gain.value = vol;

            const semitones = parseFloat(sliderPitch.value);
            const ratio = Math.pow(2, semitones / 12);
            pitchShifterNode.parameters.get('pitchRatio').setValueAtTime(ratio, audioCtx.currentTime);
            valPitch.textContent = `${semitones > 0 ? '+' : ''}${semitones} st`;

            lowEq.gain.value = parseFloat(sliderLow.value); valLow.textContent = `${sliderLow.value} dB`;
            midEq.gain.value = parseFloat(sliderMid.value); valMid.textContent = `${sliderMid.value} dB`;
            highEq.gain.value = parseFloat(sliderHigh.value); valHigh.textContent = `${sliderHigh.value} dB`;
        }

        [sliderVolume, sliderPitch, sliderLow, sliderMid, sliderHigh].forEach(s => s.addEventListener('input', updateSliders));

        document.getElementById('btn-preset-yukkuri').onclick = () => {
            sliderVolume.value = 3.0;
            sliderPitch.value = 8.5;
            sliderLow.value = -6;
            sliderMid.value = 4;
            sliderHigh.value = 10;
            updateSliders();
        };

        document.getElementById('btn-preset-reset').onclick = () => {
            sliderVolume.value = 1.0; sliderPitch.value = 0; sliderLow.value = 0; sliderMid.value = 0; sliderHigh.value = 0;
            updateSliders();
        };

        // 🌟 修正版 音声ファイル解析
        fileUpload.addEventListener('change', async (e) => {
            const file = e.target.files[0]; if (!file) return;
            fileLabel.textContent = file.name;
            analysisStatus.classList.remove('hidden');
            analysisStatus.className = "text-xs text-green-300 mt-2";
            analysisStatus.textContent = '周波数・ピッチを解析中...';

            if (sampleAudio) sampleAudio.pause();
            sampleAudio = new Audio(URL.createObjectURL(file));
            btnPlaySample.classList.remove('hidden');
            btnPlaySample.onclick = () => { sampleAudio.play(); };

            try {
                await initAudio();
                const arrayBuffer = await file.arrayBuffer();
                const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

                const channelData = audioBuffer.getChannelData(0);
                let sum = 0, validSamples = 0;
                for (let i = 0; i < channelData.length; i += 10) {
                    sum += Math.abs(channelData[i]);
                    validSamples++;
                }
                const avgAmp = sum / validSamples;

                // 振幅に応じた補正付き周波数スキャン
                let lowScore = 0, midScore = 0, highScore = 0;
                const sampleRate = audioBuffer.sampleRate;
                const step = Math.floor(channelData.length / 1000) || 1;

                for (let i = 0; i < channelData.length - step; i += step) {
                    const diff = Math.abs(channelData[i + step] - channelData[i]);
                    if (diff < 0.05) lowScore++;
                    else if (diff < 0.2) midScore++;
                    else highScore++;
                }

                // ゆっくりボイス等の声質判定によるスマートスライダーセット
                if (file.name.includes('ゆっくり') || file.name.includes('yvm') || highScore > lowScore) {
                    sliderPitch.value = 10.0;
                    sliderLow.value = -8;
                    sliderMid.value = 5;
                    sliderHigh.value = 12;
                } else {
                    sliderPitch.value = 6.0;
                    sliderLow.value = -3;
                    sliderMid.value = 2;
                    sliderHigh.value = 6;
                }

                updateSliders();
                analysisStatus.textContent = '✨ 解析完了！ゆっくり声質・EQに最適化設定しました。';
            } catch (err) {
                console.error(err);
                analysisStatus.textContent = '音声解析中にエラーが発生しました。';
                analysisStatus.className = "text-xs text-red-400 mt-2";
            }
        });

        function updateCanvasSize() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
        function drawVisualizer() {
            if (!isMicActive || !analyserNode) return;
            animationId = requestAnimationFrame(drawVisualizer);
            const bufferLength = analyserNode.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyserNode.getByteFrequencyData(dataArray);

            canvasCtx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            const barWidth = (canvas.width / bufferLength) * 2.5;
            let barHeight, x = 0;

            for (let i = 0; i < bufferLength; i++) {
                barHeight = dataArray[i];
                const r = 16, g = barHeight + (25 * (i/bufferLength)), b = 250 - (barHeight / 2);
                canvasCtx.fillStyle = `rgb(${r},${g},${b})`;
                canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
        }
    </script>
</body>
</html>
